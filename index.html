<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025 Polaroid Recap | Inshaf Dev</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark min-h-screen flex flex-col items-center py-6 transition-all duration-500" id="mainBody">

    <div class="w-full max-w-[420px] flex justify-between items-center mb-6 px-4">
        <span class="text-[10px] font-black tracking-[0.3em] opacity-60 theme-text">2025 ACHIEVEMENTS</span>
        <button onclick="toggleTheme()" class="theme-toggle-btn shadow-lg">
            <span id="themeIcon">🌙</span>
        </button>
    </div>

    <div class="w-full max-w-[420px] mb-8 px-4">
        <label class="text-[10px] font-bold theme-text opacity-50 mb-2 block uppercase">Enter Your Name</label>
        <input type="text" id="nameInput" placeholder="Enter name here..." 
            class="name-field-straight w-full p-4 rounded-xl outline-none font-bold shadow-md">
    </div>

    <div id="captureArea" class="canvas-container shadow-2xl">
        <div class="header-section text-center">
            <h1 class="font-black italic tracking-tighter text-6xl mb-1 theme-title" contenteditable="true">MY 2025</h1>
            <p class="theme-subtitle text-[10px] uppercase tracking-[0.4em]" contenteditable="true">Every moment counts</p>
        </div>

        <div class="stack-container">
            <div class="polaroid-item p-1" onclick="upload('f1')">
                <div class="img-frame" id="p1">📸</div>
                <input type="file" id="f1" hidden onchange="preview(event, 'p1')">
                <p class="polaroid-label" contenteditable="true">Main Win</p>
            </div>
            <div class="polaroid-item p-2" onclick="upload('f2')">
                <div class="img-frame" id="p2">📸</div>
                <input type="file" id="f2" hidden onchange="preview(event, 'p2')">
                <p class="polaroid-label" contenteditable="true">Memories</p>
            </div>
            <div class="polaroid-item p-3" onclick="upload('f3')">
                <div class="img-frame" id="p3">📸</div>
                <input type="file" id="f3" hidden onchange="preview(event, 'p3')">
                <p class="polaroid-label" contenteditable="true">Grateful</p>
            </div>
            <div class="polaroid-item p-4" onclick="upload('f4')">
                <div class="img-frame" id="p4">📸</div>
                <input type="file" id="f4" hidden onchange="preview(event, 'p4')">
                <p class="polaroid-label" contenteditable="true">Goals</p>
            </div>
            <div class="polaroid-item p-5" onclick="upload('f5')">
                <div class="img-frame" id="p5">📸</div>
                <input type="file" id="f5" hidden onchange="preview(event, 'p5')">
                <p class="polaroid-label" contenteditable="true">2026 Ready</p>
            </div>
        </div>

        <div class="canvas-footer">
            <div class="flex justify-between items-center w-full px-6 py-4">
                <span class="text-[10px] font-bold opacity-60 theme-text uppercase tracking-widest" id="displayName">MOHOMED INSHAF</span>
                <span class="text-[9px] font-black opacity-40 theme-text">© INSHAF DEV</span>
            </div>
        </div>
    </div>

    <div class="max-w-[420px] w-full px-4 mt-8 pb-10">
        <button onclick="downloadImage()" class="save-button w-full py-4 font-black rounded-2xl transition-all shadow-xl">
            SAVE RECAP TO GALLERY 📥
        </button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
